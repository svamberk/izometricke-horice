<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;

// parametry: ?mpp=0.2&tile=1024&season=autumn&mode=day|lights
const PARAMS = Object.fromEntries(new URLSearchParams(location.search));
const MPP = parseFloat(PARAMS.mpp || '0.2');
const TILE = parseInt(PARAMS.tile || '1024');
const SEASON = PARAMS.season || 'autumn';
const SEASON_ID = { spring: 0, summer: 1, autumn: 2, winter: 3 }[SEASON];
const LIGHTS = PARAMS.mode === 'lights';
const PAD = 4;
const DIR = PARAMS.dir || 'build';
const ALPHA = PARAMS.alpha === '1';            // průhledné pozadí (čtverce se skládají přes sebe)
let SKIRT_EDGES = PARAMS.skirt || 'nsew';     // které okraje mají řez zeminou (výchozí ze scény podle sousedů)
const BG = LIGHTS ? [0, 0, 0] : [27 / 255, 35 / 255, 51 / 255];
const SKIRT = 28;

const scene = await (await fetch(`${DIR}/scene.json`)).json();
const HALF = scene.half, N = scene.n, HS = scene.heights;
if (!PARAMS.skirt && scene.skirt !== undefined) SKIRT_EDGES = scene.skirt;
const FLOOR = scene.floor ?? -SKIRT;                 // spodek řezu zeminou (společný pro všechny čtverce)
const MS = scene.ms || 0, NE = N + 2 * MS, HX = scene.hext || HS;   // výšky i s pásem sousedů
const HE = HALF + (scene.margin || 0);               // rozšířený výřez (budovy a stromy sousedů u švu)
const [OFFX, OFFY] = scene.center || [0, 0];        // střed čtverce ve světových souřadnicích

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, alpha: ALPHA, premultipliedAlpha: false });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(1);
renderer.setSize(TILE + 2 * PAD, TILE + 2 * PAD);
document.body.appendChild(renderer.domElement);
const world = new THREE.Scene();

// ---------- kamera: dimetrie 2:1 (SimCity 2000), pohled od JZ, otočení parametrem az (musí odpovídat geo.py) ----------
const EL = Math.asin(Math.tan(Math.atan(0.5)));
const AZ = THREE.MathUtils.degToRad(parseFloat(PARAMS.az || '225'));   // 225 od JZ, 315 od SZ, 45 od SV, 135 od JV
const camDir = new THREE.Vector3(Math.sin(AZ) * Math.cos(EL), Math.sin(EL), -Math.cos(AZ) * Math.cos(EL));
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 8000);
cam.position.copy(camDir).multiplyScalar(4000);
cam.lookAt(0, 0, 0);
cam.updateMatrixWorld();
// slunce se otáčí s kamerou (geo.SUN): ve všech pohledech svítí na pravou stěnu domů
const SUN = (() => { const d = AZ - THREE.MathUtils.degToRad(225), x = 0.38, z = 0.68;
  return new THREE.Vector3(x * Math.cos(d) - z * Math.sin(d), 0.62, z * Math.cos(d) + x * Math.sin(d)).normalize(); })();

// ---------- společné shadery ----------
const COMMON = /* glsl */`
uniform vec3 uSun; uniform vec3 uCam; uniform sampler2D uShadow; uniform mat4 uLightVP; uniform float uSeason; uniform float uLights; uniform vec2 uOff;
vec3 fn(vec3 n){ return dot(n, uCam) < 0.0 ? -n : n; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float band(float d){ return d > 0.72 ? 1.0 : d > 0.42 ? 0.88 : d > 0.12 ? 0.76 : 0.66; }
float shadow(vec3 wp, vec3 n){
  vec4 p = uLightVP * vec4(wp + n * 0.3, 1.0);
  vec3 c = p.xyz / p.w * 0.5 + 0.5;
  if (c.x < 0.0 || c.x > 1.0 || c.y < 0.0 || c.y > 1.0) return 1.0;
  return (c.z - 0.00025 > texture2D(uShadow, c.xy).r) ? 0.0 : 1.0;
}
vec3 shade(vec3 col, vec3 n, vec3 wp){
  float d = max(dot(n, uSun), 0.0);
  float s = shadow(wp, n);
  float l = band(d * mix(0.25, 1.0, s));
  vec3 c = col * l;
  if (s < 0.5) c *= vec3(0.80, 0.84, 0.94);   // namodralý stín
  return c;
}
bool winter(){ return uSeason > 2.5; }
const vec3 SNOW = vec3(0.92, 0.94, 0.98);`;
const VERT = /* glsl */`
attribute vec3 color; attribute vec4 aw;
varying vec3 vC; varying vec3 vN; varying vec3 vW; varying vec4 vA; varying vec2 vUv;
void main(){
  vec4 p = vec4(position, 1.0);
  vec3 n = normal;
  vec3 c = color;
  #ifdef USE_INSTANCING
    p = instanceMatrix * p;
    n = normalize(mat3(instanceMatrix) * n);
  #endif
  #ifdef USE_INSTANCING_COLOR
    if (aw.y < 0.5) c *= instanceColor;
  #endif
  vec4 w = modelMatrix * p;
  vW = w.xyz; vN = n; vC = c; vA = aw; vUv = uv;
  gl_Position = projectionMatrix * viewMatrix * w;

const shadowRT = new THREE.WebGLRenderTarget(8192, 8192, { depthTexture: new THREE.DepthTexture(8192, 8192, THREE.FloatType) });

    uniforms: {
      uSun: { value: SUN }, uCam: { value: camDir }, uShadow: { value: shadowRT.depthTexture }, uLightVP: { value: new THREE.Matrix4() },
      uSeason: { value: SEASON_ID }, uLights: { value: LIGHTS ? 1 : 0 }, uOff: { value: new THREE.Vector2(OFFX, -OFFY) }, ...extra,
    },
    vertexShader: VERT, fragmentShader: COMMON + frag, side,
  });

  g.setAttribute('normal', new THREE.Float32BufferAttribute(B.n, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(B.c, 3));
  g.setAttribute('aw', new THREE.Float32BufferAttribute(B.a, 4));
  return g;
}
const newBuf = () => ({ p: [], n: [], c: [], a: [] });
function pushTri(B, a, b, c, col, aw) {
  const A = new THREE.Vector3(...a), Bv = new THREE.Vector3(...b), Cv = new THREE.Vector3(...c);

}

const frameAt = (x, y, z, ang) => (s, t, h) => tv(x + Math.cos(ang) * s - Math.sin(ang) * t, y + Math.sin(ang) * s + Math.cos(ang) * t, z + h);
const C255 = (rgb) => rgb.map((v) => v / 255);

// ---------- terén ----------
{
  const pos = [], uv = [], idx = [];
  const step = scene.step;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = -HALF + c * step, y = HALF - r * step;
    pos.push(x, HS[r * N + c], -y);
    uv.push((x + HALF) / (2 * HALF), (y + HALF) / (2 * HALF));
  }
  for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
    const a = r * N + c, b = a + 1, d = a + N, e = d + 1;
    idx.push(a, d, b, b, d, e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const n = g.attributes.position.count;
  g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(n * 3).fill(1), 3));
  g.setAttribute('aw', new THREE.Float32BufferAttribute(new Float32Array(n * 4), 4));
  const load = async (u) => { const t = await new THREE.TextureLoader().loadAsync(u); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.NoColorSpace; return t; };
  const tex = await load(`${DIR}/ground_${SEASON}.png`);
  const lmap = await load(`${DIR}/lightmap.png`);
  lmap.magFilter = lmap.minFilter = THREE.LinearFilter;
  const m = mat(/* glsl */`
    uniform sampler2D uTex, uLmap;
    varying vec3 vN; varying vec3 vW; varying vec2 vUv;
    void main(){
      if (uLights > 0.5) {
        float l = texture2D(uLmap, vUv).r;
        l = floor(l * 5.0 + hash(floor(gl_FragCoord.xy)) * 0.9) / 5.0;   // stupňovaný kužel = pixel-art
        gl_FragColor = vec4(vec3(1.0, 0.76, 0.42) * l * 0.85, 1.0); return;
      }
      vec3 col = texture2D(uTex, vUv).rgb;
      vec3 n = normalize(vN);
      float d = max(dot(n, uSun), 0.0);
      float s = shadow(vW, n);
      float l = 0.80 + 0.22 * floor(d * 6.0 + 0.5) / 6.0;
      col *= l * (s > 0.5 ? 1.0 : 0.74);

      gl_FragColor = vec4(col, 1.0);
    }`, { uTex: { value: tex }, uLmap: { value: lmap } });
  world.add(new THREE.Mesh(g, m));

  // terén sousedů v pásu u švu: jen do hloubky (neviditelný). Obrysy pak na švu nekreslí hranu
  // a sousední budovy a stromy se správně schovají za kopec.
  if (MS) {
    const nb = scene.nb || [];
    const inNb = (x, y) => nb.some(([di, dj]) => Math.abs(x - di * 2 * HALF) <= HALF && Math.abs(y - dj * 2 * HALF) <= HALF);
    const pos2 = [], idx2 = [];
    for (let r = 0; r < NE; r++) for (let c = 0; c < NE; c++) pos2.push(-HALF + (c - MS) * step, HX[r * NE + c], -(HALF - (r - MS) * step));
    for (let r = 0; r < NE - 1; r++) for (let c = 0; c < NE - 1; c++) {
      const x = -HALF + (c - MS + 0.5) * step, y = HALF - (r - MS + 0.5) * step;
      if ((Math.abs(x) < HALF && Math.abs(y) < HALF) || !inNb(x, y)) continue;
      const a = r * NE + c, b = a + 1, d = a + NE, e = d + 1;
      idx2.push(a, d, b, b, d, e);
    }
    const g2 = new THREE.BufferGeometry();
    g2.setAttribute('position', new THREE.Float32BufferAttribute(pos2, 3));
    g2.setIndex(idx2);
    world.add(new THREE.Mesh(g2, new THREE.MeshBasicMaterial({ colorWrite: false })));
  }

  // řez zeminou po obvodu ostrova
  const S = newBuf();
  const H = (r, c) => HS[r * N + c];
  const edges = [[(i) => [0, i], [0, 0, -1], 'n'], [(i) => [N - 1, i], [0, 0, 1], 's'], [(i) => [i, 0], [-1, 0, 0], 'w'], [(i) => [i, N - 1], [1, 0, 0], 'e']].filter((e) => SKIRT_EDGES.includes(e[2]));
  for (const [rc, nrm] of edges) for (let i = 0; i < N - 1; i++) {
    const [r0, c0] = rc(i), [r1, c1] = rc(i + 1);
    const p0 = [-HALF + c0 * step, H(r0, c0), -(HALF - r0 * step)], p1 = [-HALF + c1 * step, H(r1, c1), -(HALF - r1 * step)];
    const b0 = [p0[0], FLOOR, p0[2]], b1 = [p1[0], FLOOR, p1[2]];
    for (const v of [p0, b0, p1, p1, b0, b1]) { S.p.push(...v); S.n.push(...nrm); S.c.push(1, 1, 1); S.a.push(0, 0, 0, 0); }
  }
  world.add(new THREE.Mesh(geom(S), mat(/* glsl */`
    varying vec3 vN; varying vec3 vW;
    void main(){
      if (uLights > 0.5) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
      float y = vW.y;
      vec3 col = vec3(0.47, 0.33, 0.22);
      if (y < 20.0) col = vec3(0.55, 0.40, 0.27);
      if (y < 0.0) col = vec3(0.40, 0.36, 0.33);
      if (y < -14.0) col = vec3(0.33, 0.30, 0.29);
      if (fract((vW.x + vW.z) * 0.37 + y * 0.9) < 0.08) col *= 0.85;
      col *= (abs(vN.x) > 0.5) ? 0.82 : 1.0;
      gl_FragColor = vec4(col, 1.0);
    }`, {}, THREE.DoubleSide)));
}

// ---------- materiály budov ----------
const wallMat = mat(/* glsl */`
  varying vec3 vC; varying vec3 vN; varying vec3 vW; varying vec4 vA;
  float win(float u, float len, float sp, float w){
    float n = floor((len - 0.6) / sp);
    if (n < 1.0) return 0.0;
    float off = (len - n * sp) * 0.5;
    float q = (u - off) / sp;
    if (q < 0.0 || q >= n) return 0.0;
    return abs(fract(q) - 0.5) < w / (2.0 * sp) ? 1.0 : 0.0;
  }

    vec3 n = fn(normalize(vN));

    : [G.summer[0], G.summer[1], G.summer[2], G.summer[0], G.summer[1], G.summer[2], G.summer[0], G.summer[1]];
  const winter = season === 'winter';
  const slots = { dec: [[], [], []], con: [[], [], []], col: [[], []], bush: [] };
  let slot = 0;
  const draw = (fn) => { const B = newBufC(); fn(B); const [ox, oy] = cell(slot); actx.putImageData(new ImageData(B.rgb, CW, CH), ox, oy); return slot++; };
  DEC_H.forEach((H, si) => { for (let v = 0; v < (season === 'spring' ? 12 : 8); v++) slots.dec[si].push(draw((B) => winter ? winterTree(B, H * 0.866 / PX, H * 0.62 / PX) : deciduous(B, H * 0.866 / PX, H * 0.62 / PX, decPals[v % decPals.length]))); });
  // na jaře kvete jen část stromů (bílá, výjimečně růžová) – víc zelených variant v atlasu
  if (season === 'spring') slots.dec[1][5] = draw((B) => deciduous(B, DEC_H[1] * 0.866 / PX, DEC_H[1] * 0.62 / PX, G.blossomP));
  CON_H.forEach((H, si) => { for (let v = 0; v < 4; v++) slots.con[si].push(draw((B) => conifer(B, H * 0.866 / PX, H * 0.42 / PX, G.conifer[v % 2], winter))); });
  COL_H.forEach((H, si) => { for (let v = 0; v < 3; v++) slots.col[si].push(draw((B) => columnar(B, H * 0.866 / PX, Math.max(5, H * 0.22 / PX), G.conifer[v % 2], winter))); });
  for (let v = 0; v < 4; v++) slots.bush.push(draw((B) => {
    const pal = winter ? P('#2e2620', '#4a3e34', '#625244', '#d6dde8', '#f4f7fb') : decPals[v * 2 % decPals.length];
    blobCrown(B, CW / 2, CH - 3 - BUSH_H * 0.4 / PX, 2.2 / PX, BUSH_H * 0.42 / PX, pal, 4); outline(B, pal[0]);
  }));
  const tex = new THREE.CanvasTexture(atlas);
  tex.magFilter = tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false; tex.colorSpace = THREE.NoColorSpace;
  // instance billboardů
  const plane = new THREE.PlaneGeometry(CW * PX, CH * PX);
  plane.translate(0, CH * PX / 2 - 3 * PX, 0);
  const n = T.length;
  const aTile = new Float32Array(n * 2);
  const bb = new THREE.InstancedMesh(plane, new THREE.ShaderMaterial({
    uniforms: { uAtlas: { value: tex }, uCell: { value: new THREE.Vector2(CW / atlas.width, CH / atlas.height) }, uShadow: { value: shadowRT.depthTexture }, uLightVP: { value: new THREE.Matrix4() }, uLights: { value: LIGHTS ? 1 : 0 } },
    vertexShader: /* glsl */`
      attribute vec2 aTile; varying vec2 vUv; varying vec3 vW;
      void main(){ vec4 w = modelMatrix * instanceMatrix * vec4(position, 1.0); vW = w.xyz; vUv = aTile + uv * vec2(${(CW / atlas.width).toFixed(6)}, ${(CH / atlas.height).toFixed(6)}); gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
      uniform sampler2D uAtlas, uShadow; uniform mat4 uLightVP; uniform float uLights; varying vec2 vUv; varying vec3 vW;
      void main(){
        vec4 c = texture2D(uAtlas, vUv);
        if (c.a < 0.5) discard;
        if (uLights > 0.5) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
        vec4 p = uLightVP * vec4(vW, 1.0); vec3 s = p.xyz / p.w * 0.5 + 0.5;
        float sh = (s.x > 0.0 && s.x < 1.0 && s.y > 0.0 && s.y < 1.0 && s.z - 0.0012 > texture2D(uShadow, s.xy).r) ? 0.78 : 1.0;
        vec3 col = c.rgb * sh; if (sh < 1.0) col *= vec3(0.86, 0.9, 1.0);
        gl_FragColor = vec4(col, 1.0);
      }`,
  }), n);
  allMats.push(bb.material);
  const m4 = new THREE.Matrix4(), pos = new THREE.Vector3(), sc = new THREE.Vector3();
  const hsh = (x, y) => { const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return v - Math.floor(v); };
  T.forEach(([x, y, z, h, conif, kind], i) => {
    const r = hsh(Math.round((x + OFFX) * 100) / 100, Math.round((y + OFFY) * 100) / 100);   // světové souřadnice
    let list, Hc;
    if (kind === 1) { list = slots.bush; Hc = BUSH_H; }
    else if (kind === 3) { const si = h < 8 ? 0 : 1; list = slots.col[si]; Hc = COL_H[si]; }
    else if (conif) { const si = h < 12 ? 0 : h < 18 ? 1 : 2; list = slots.con[si]; Hc = CON_H[si]; }
    else { const si = h < 10.5 ? 0 : h < 16 ? 1 : 2; list = slots.dec[si]; Hc = DEC_H[si]; }
    const sl = list[Math.floor(r * list.length)];
    const [ox, oy] = cell(sl);
    aTile[i * 2] = ox / atlas.width; aTile[i * 2 + 1] = 1 - (oy + CH) / atlas.height;
    const s_ = Math.max(0.75, Math.min(1.3, h / Hc));
    pos.set(x, z, -y);
    m4.compose(pos, cam.quaternion, sc.set(s_, s_, 1));
    bb.setMatrixAt(i, m4);
  });
  bb.geometry.setAttribute('aTile', new THREE.InstancedBufferAttribute(aTile, 2));
  bb.frustumCulled = false; bb.layers.set(1); cam.layers.enable(1);
  world.add(bb);

  // neviditelná tělesa jen pro stínovou mapu (vrstva 2)
  const shadowMat = new THREE.MeshBasicMaterial();
  const crownG = new THREE.IcosahedronGeometry(1, 0), coneG = new THREE.ConeGeometry(1, 1, 6);
  const crowns = new THREE.InstancedMesh(crownG, shadowMat, n), cones = new THREE.InstancedMesh(coneG, shadowMat, n);
  let kc = 0, kk = 0; const q = new THREE.Quaternion();
  for (const [x, y, z, h, conif, kind] of T) {
    if (conif || kind === 3) { m4.compose(pos.set(x, z + h * 0.5, -y), q, sc.set(h * (kind === 3 ? 0.11 : 0.2), h, h * (kind === 3 ? 0.11 : 0.2))); cones.setMatrixAt(kk++, m4); }
    else { const r = kind === 1 ? h * 0.5 : h * 0.31, ch = kind === 1 ? h * 0.45 : h * 0.4; m4.compose(pos.set(x, z + h - ch, -y), q, sc.set(r, ch, r)); crowns.setMatrixAt(kc++, m4); }
  }
  crowns.count = kc; cones.count = kk;
  for (const m of [crowns, cones]) { m.frustumCulled = false; m.layers.set(2); world.add(m); }
  window.TREE_ATLAS = atlas;
}

// ---------- stínová mapa ----------
{
  const lc = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 6000);
  lc.position.copy(SUN).multiplyScalar(3000);
  lc.lookAt(0, 0, 0); lc.updateMatrixWorld();
  lc.layers.enable(2);
  const inv = lc.matrixWorldInverse;
  let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9, mnz = 1e9, mxz = -1e9;
  for (const x of [-HE, HE]) for (const z of [-HE, HE]) for (const y of [FLOOR, (scene.top ?? 220) + 5]) {
    const v = new THREE.Vector3(x, y, z).applyMatrix4(inv);
    mnx = Math.min(mnx, v.x); mxx = Math.max(mxx, v.x); mny = Math.min(mny, v.y); mxy = Math.max(mxy, v.y);
    mnz = Math.min(mnz, v.z); mxz = Math.max(mxz, v.z);
  }
  // near/far z rozsahu čtverce: pevné 2000–4000 nestačilo, roh za far plane byl celý ve stínu
  Object.assign(lc, { left: mnx, right: mxx, bottom: mny, top: mxy, near: -mxz - 10, far: -mnz + 10 });
  lc.updateProjectionMatrix();
  world.overrideMaterial = new THREE.MeshDepthMaterial();
  renderer.setRenderTarget(shadowRT); renderer.clear(); renderer.render(world, lc);
  renderer.setRenderTarget(null); world.overrideMaterial = null;
  const vp = new THREE.Matrix4().multiplyMatrices(lc.projectionMatrix, lc.matrixWorldInverse);
  for (const m of allMats) m.uniforms.uLightVP.value.copy(vp);
}

// ---------- rozsah obrázku ----------
// obvod terénu (i s pásem sousedů) od spodku řezu po +30 m, k tomu vrcholy budov a stromů
const inv = cam.matrixWorldInverse;
let X0 = 1e9, X1 = -1e9, Y0 = 1e9, Y1 = -1e9;
const ext = (x, h, y) => {
  const v = new THREE.Vector3(x, h, -y).applyMatrix4(inv);
  X0 = Math.min(X0, v.x); X1 = Math.max(X1, v.x); Y0 = Math.min(Y0, v.y); Y1 = Math.max(Y1, v.y);
};
{
  const R = MS ? HE : HALF, k0 = MS ? Math.round((scene.margin || 0) / scene.step) : 0;
  for (let r = MS - k0; r <= MS + N - 1 + k0; r += 2) for (let c = MS - k0; c <= MS + N - 1 + k0; c += 2) {
    if (r > MS - k0 + 1 && c > MS - k0 + 1 && r < MS + N - 2 + k0 && c < MS + N - 2 + k0) continue;
    const x = -HALF + (c - MS) * scene.step, y = HALF - (r - MS) * scene.step;
    const h = MS ? HX[r * NE + c] : HS[r * N + c];
    ext(Math.max(-R, Math.min(R, x)), h + 30, Math.max(-R, Math.min(R, y))); ext(Math.max(-R, Math.min(R, x)), FLOOR, Math.max(-R, Math.min(R, y)));
  }
  for (let r = 0; r < N; r += 8) for (let c = 0; c < N; c += 8) ext(-HALF + c * scene.step, HS[r * N + c] + 5, HALF - r * scene.step);   // vrcholy kopců uvnitř
  for (const b of scene.buildings) for (const [x, y] of b.p) ext(x, Math.max(b.e + b.rh + 2, b.tm ? b.g + b.tm[6] + 22 : 0), y);
  for (const t of scene.trees) ext(t[0], t[2] + t[3], t[1]);
}
X0 -= 20; Y0 -= 20; X1 += 20; Y1 += 60;     // nahoře rezerva na věže (ručně stavěné dominanty)
// přichytit k mřížce pixelů společné mapy (gx0/gy1 = počátek celé mapy v souřadnicích kamery)
const [CXW, CYW] = scene.center || [0, 0];
const offV = new THREE.Vector3(CXW, 0, -CYW).applyMatrix4(inv).sub(new THREE.Vector3(0, 0, 0).applyMatrix4(inv));
let GX0 = X0 + offV.x, GY1 = Y1 + offV.y;
if (PARAMS.gx0) {
  GX0 = parseFloat(PARAMS.gx0) + Math.floor((GX0 - parseFloat(PARAMS.gx0)) / MPP + 1e-6) * MPP;
  GY1 = parseFloat(PARAMS.gy1) + Math.ceil((GY1 - parseFloat(PARAMS.gy1)) / MPP - 1e-6) * MPP;
  X0 = GX0 - offV.x; Y1 = GY1 - offV.y;
}
const IW = Math.ceil((X1 - X0) / MPP), IH = Math.ceil((Y1 - Y0) / MPP);

// ---------- post-process: obrysy a světlá hrana nahoře (pixel-art) ----------
const S = TILE + 2 * PAD;
const rt = new THREE.WebGLRenderTarget(S, S, { depthTexture: new THREE.DepthTexture(S, S, THREE.FloatType), magFilter: THREE.NearestFilter, minFilter: THREE.NearestFilter });
const post = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { tC: { value: rt.texture }, tD: { value: rt.depthTexture }, px: { value: new THREE.Vector2(1 / S, 1 / S) }, range: { value: 1 }, lights: { value: LIGHTS ? 1 : 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: /* glsl */`
    uniform sampler2D tC, tD; uniform vec2 px; uniform float range, lights; varying vec2 vUv;
    float D(vec2 o){ return texture2D(tD, vUv + o * px).r * range; }
    void main(){
      vec4 c4 = texture2D(tC, vUv); vec3 c = c4.rgb;
      if (lights > 0.5) { gl_FragColor = vec4(c, c4.a); return; }
      float d = D(vec2(0.0));
      float up = D(vec2(0.0, 1.0));
      float m = max(max(D(vec2(1.0, 0.0)), D(vec2(-1.0, 0.0))), max(up, D(vec2(0.0, -1.0))));
      if (m - d > 1.6) {
        c *= 0.5;                                   // tmavý obrys
        if (up - d > 1.6) c = c / 0.5 * 1.18;       // horní hrana: světlý okraj místo tmavého
      }
      gl_FragColor = vec4(c, c4.a);
    }`,
}));
const postScene = new THREE.Scene(); postScene.add(post);
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

window.INFO = { width: IW, height: IH, tile: TILE, cols: Math.ceil(IW / TILE), rows: Math.ceil(IH / TILE), x0: GX0, y1: GY1, mpp: MPP, chunk: scene.chunk || [0, 0], season: SEASON, mode: LIGHTS ? 'lights' : 'day' };
const out = document.createElement('canvas'); out.width = TILE; out.height = TILE;
const octx = out.getContext('2d');
window.renderTile = (i, j) => {
  const l = X0 + (i * TILE - PAD) * MPP, t = Y1 - (j * TILE - PAD) * MPP;
  Object.assign(cam, { left: l, right: l + S * MPP, top: t, bottom: t - S * MPP, near: 500, far: 7500 });
  cam.updateProjectionMatrix();
  post.material.uniforms.range.value = cam.far - cam.near;
  renderer.setClearColor(new THREE.Color(...BG), ALPHA ? 0 : 1);
  renderer.setRenderTarget(rt); renderer.clear(); renderer.render(world, cam);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  octx.clearRect(0, 0, TILE, TILE);
  octx.drawImage(renderer.domElement, PAD, PAD, TILE, TILE, 0, 0, TILE, TILE);
  return out.toDataURL('image/png');
};
window.READY = true;
</script>
